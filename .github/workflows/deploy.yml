name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend (Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eshopbox-sales-assist-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e092a59bfb57a3a9bd5b86f8f1e94430

  deploy-frontend:
    name: Deploy Frontend (Pages)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eshopbox-sales-assist-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Deploy Pages
        run: npx wrangler pages deploy dist --project-name eshopbox-sales-assist --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e092a59bfb57a3a9bd5b86f8f1e94430
